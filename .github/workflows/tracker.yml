name: Shipping Tracker Daily Report

on:
  schedule:
    # Se ejecuta todos los días a las 12:00 UTC (9:00 AM en huso horario UTC-3)
    - cron: '0 12 * * *'
  workflow_dispatch:
    # Permite ejecutar el rastreo de forma manual desde la pestaña Actions en GitHub

jobs:
  track-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm install

      - name: Ejecutar Rastreador de Envíos
        env:
          TRACK_17_TOKEN: ${{ secrets.TRACK_17_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: node index.js
