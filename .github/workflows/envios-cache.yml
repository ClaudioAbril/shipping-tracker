name: Actualizar caché Envios

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Generar tracking-cache.json
        run: node scripts/build-tracking-cache.js

      - name: Publicar caché en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracking-cache.json
          git diff --staged --quiet || git commit -m "chore: actualizar tracking-cache.json para Envios.html"
          git push
