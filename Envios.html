<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de envíos - MailAmericas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
        }

        h2 {
            color: #0066cc;
        }

        .panel {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .panel label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        #codes-input {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            font-family: Consolas, monospace;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
        }

        .panel-actions {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        #btn-consultar {
            background: #0066cc;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        #btn-consultar:hover {
            background: #0052a3;
        }

        #btn-consultar:disabled {
            background: #99b3d6;
            cursor: wait;
        }

        .ayuda {
            font-size: 13px;
            color: #666;
            margin: 8px 0 0;
        }

        .aviso-api {
            font-size: 12px;
            color: #555;
            margin-top: 10px;
            padding: 10px;
            background: #f0f6ff;
            border-radius: 6px;
            border: 1px solid #c5d9f5;
        }

        #status-msg {
            font-size: 13px;
            color: #555;
        }

        #status-msg.error {
            color: #b71c1c;
        }

        #status-msg.warn {
            color: #e65100;
        }

        .envio {
            background: #fff;
            border: 1px solid #ddd;
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
        }

        .envio.error-card {
            border-color: #f5c6cb;
            background: #fff8f8;
        }

        .barra {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            gap: 4px;
        }

        .etapa {
            flex: 1;
            text-align: center;
            font-size: 11px;
            position: relative;
            min-width: 0;
        }

        .etapa::before {
            content: "";
            display: block;
            height: 10px;
            margin-bottom: 5px;
            border-radius: 5px;
            background: #ddd;
        }

        .etapa.activa::before {
            background: #4caf50;
        }

        .etapa-nombre {
            display: block;
            font-weight: 600;
            line-height: 1.2;
        }

        .etapa-sub {
            display: block;
            font-size: 9px;
            font-weight: normal;
            color: #777;
            margin-top: 3px;
            line-height: 1.15;
        }

        .etapa.activa .etapa-sub {
            color: #2e7d32;
        }

        .entrega-estimada {
            font-size: 13px;
            color: #555;
            margin: 0 0 8px;
        }

        .eventos {
            list-style: none;
            padding: 0;
            margin: 12px 0 0;
            border-top: 1px solid #eee;
            padding-top: 12px;
        }

        .eventos li {
            font-size: 13px;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .eventos li:last-child {
            border-bottom: none;
        }

        .eventos .fecha {
            color: #666;
            font-size: 12px;
        }

        .eventos .lugar {
            color: #888;
            font-size: 12px;
        }

        .eventos-vacio {
            font-size: 13px;
            color: #888;
            font-style: italic;
        }

        .envio-footer {
            margin-top: 10px;
            font-size: 12px;
        }

        .envio-footer a {
            color: #0066cc;
        }

        #envios-empty {
            text-align: center;
            color: #666;
            padding: 24px;
            background: #fff;
            border: 1px dashed #ccc;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <h2>Estado de envíos en MailAmericas</h2>

    <div class="panel">
        <label for="codes-input">Códigos de seguimiento</label>
        <textarea id="codes-input"
            placeholder="MLAR086122180EX&#10;MLAR086123485EX&#10;(uno por línea o separados por coma)"></textarea>
        <p class="ayuda">Ingresá un código por línea o separados por coma. Los códigos se guardan al consultar y se
            recuperan en la próxima visita.</p>
        <p class="aviso-api" id="api-hint" hidden></p>
        <div class="panel-actions">
            <button type="button" id="btn-consultar">Consultar</button>
            <span id="status-msg" role="status"></span>
        </div>
    </div>

    <div id="envios-list"></div>
    <div id="envios-empty" hidden>No hay códigos para consultar. Agregá al menos uno arriba y pulsá Consultar.</div>

    <script>
        (function () {
            var STORAGE_KEY = 'mailamericas.envios.codes';
            var DEFAULT_CODES = ['MLAR086122180EX', 'MLAR086123485EX'];
            var ETAPAS = ['Almacén', 'En Tránsito', 'Llegada', 'Aduana', 'Distribución', 'Última Milla', 'Entregado'];

            var textarea = document.getElementById('codes-input');
            var btnConsultar = document.getElementById('btn-consultar');
            var statusMsg = document.getElementById('status-msg');
            var apiHint = document.getElementById('api-hint');
            var enviosList = document.getElementById('envios-list');
            var enviosEmpty = document.getElementById('envios-empty');

            function parseTrackingCodes(text) {
                return [...new Set(
                    text.split(/[\n,]+/).map(function (s) { return s.trim().toUpperCase(); }).filter(Boolean)
                )];
            }

            function trackingUrl(code) {
                return 'https://mailamericas.com/tracking?number_id=' + encodeURIComponent(code);
            }

            function resolveApiBase() {
                var params = new URLSearchParams(location.search);
                var fromQuery = params.get('api');
                if (fromQuery) return fromQuery.replace(/\/$/, '');
                if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
                    return '';
                }
                return '';
            }

            function updateApiHint() {
                var onGithub = location.hostname.endsWith('github.io');
                if (!onGithub) {
                    apiHint.hidden = true;
                    return;
                }
                apiHint.hidden = false;
                apiHint.textContent = 'Este servicio es de uso interno y está a prueba. Sólo Claudio y personas autorizadas pueden usarlo.';
            }

            var MONTHS_ES = {
                '01': 'ene', '02': 'feb', '03': 'mar', '04': 'abr', '05': 'may', '06': 'jun',
                '07': 'jul', '08': 'ago', '09': 'sep', '10': 'oct', '11': 'nov', '12': 'dic'
            };

            var DAYS_BEFORE_DELIVERY = [null, null, 14, 10, 6, 3, 0];

            function formatEventTime(date, time) {
                if (!date) return time || '';
                var parts = date.split('-');
                if (parts.length === 3) {
                    var day = parseInt(parts[2], 10);
                    var mon = MONTHS_ES[parts[1]] || parts[1];
                    var label = day + ' ' + mon;
                    return time ? label + ', ' + time : label;
                }
                return time ? date + ' ' + time : date;
            }

            function parseIsoDate(dateStr) {
                if (!dateStr) return null;
                var d = new Date(dateStr + 'T12:00:00');
                return isNaN(d.getTime()) ? null : d;
            }

            function formatShortDate(date) {
                var mon = MONTHS_ES[String(date.getMonth() + 1).padStart(2, '0')] ||
                    String(date.getMonth() + 1);
                return date.getDate() + ' ' + mon;
            }

            function daysFromToday(target) {
                var today = new Date();
                today.setHours(12, 0, 0, 0);
                var t = new Date(target);
                t.setHours(12, 0, 0, 0);
                return Math.round((t - today) / 86400000);
            }

            function stageIndexFromEvent(evt) {
                var text = ((evt.status || '') + ' ' + (evt.description || '')).toLowerCase();
                if (/entregado|delivered/.test(text)) return 6;
                if (/última milla|ultima milla|last mile|reparto/.test(text)) return 5;
                if (/distribuci/.test(text)) return 4;
                if (/aduana|customs/.test(text)) return 3;
                if (/llegada|arrival|ingreso/.test(text)) return 2;
                if (/tr[aá]nsito|transit|aeropuerto|pa[ií]s destino/.test(text)) return 1;
                if (/almac[eé]n|warehouse|origen|procesado|despachado|recibido|tax|orden/.test(text)) return 0;
                if (typeof evt.eventStep === 'number') {
                    if (evt.eventStep <= 1) return 0;
                    if (evt.eventStep === 2) return 1;
                    return Math.min(6, evt.eventStep);
                }
                return 0;
            }

            function buildStageSubLabels(rawEvents, activeStageIndex, estimatedDelivery) {
                var sublabels = [];
                var stageDates = [];
                var i;
                for (i = 0; i < ETAPAS.length; i++) {
                    sublabels.push('');
                    stageDates.push(null);
                }
                var active = Math.max(0, Math.min(6, activeStageIndex));
                var lastKnown = null;

                (rawEvents || []).forEach(function (evt) {
                    var idx = stageIndexFromEvent(evt);
                    var d = parseIsoDate(evt.date);
                    if (!d) return;
                    if (!stageDates[idx] || d > stageDates[idx]) stageDates[idx] = d;
                });

                for (i = 0; i < ETAPAS.length; i++) {
                    if (stageDates[i]) lastKnown = stageDates[i];
                    else if (lastKnown && i <= active) stageDates[i] = lastKnown;
                }

                var delivery = parseIsoDate(estimatedDelivery);
                for (i = 0; i < ETAPAS.length; i++) {
                    if (stageDates[i] && i < active) {
                        sublabels[i] = formatShortDate(stageDates[i]);
                    } else if (stageDates[i] && i === active) {
                        sublabels[i] = formatShortDate(stageDates[i]) + ' · en curso';
                    } else if (i > active && delivery && DAYS_BEFORE_DELIVERY[i] != null) {
                        var est = new Date(delivery);
                        est.setDate(est.getDate() - DAYS_BEFORE_DELIVERY[i]);
                        var days = daysFromToday(est);
                        if (days <= 0) sublabels[i] = formatShortDate(est);
                        else if (days === 1) sublabels[i] = '~1 día';
                        else sublabels[i] = '~' + days + ' días';
                    } else if (i > active) {
                        sublabels[i] = 'pendiente';
                    }
                }
                if (delivery) {
                    sublabels[6] = formatShortDate(delivery);
                    if (active === 6) sublabels[6] += ' · en curso';
                }
                return sublabels;
            }

            function normalizeMailAmericas(payload, fallbackNumber) {
                var d = payload && payload.data ? payload.data : null;
                if (!d) return null;
                var number = (d.trackingNumber || fallbackNumber || '').toUpperCase();
                var rawEvents = d.events || [];
                var events = rawEvents.map(function (evt) {
                    return {
                        time: formatEventTime(evt.date, evt.time),
                        description: evt.description || evt.status || 'Evento',
                        location: [evt.status, evt.location].filter(Boolean).join(' — ')
                    };
                });
                var step = typeof d.statusStep === 'number' ? d.statusStep : 1;
                var activeStageIndex = Math.min(ETAPAS.length - 1, Math.max(0, step - 1));
                var deliveryDate = parseIsoDate(d.estimatedDelivery);
                return {
                    number: number,
                    statusLabel: d.statusStepName || d.status || 'Desconocido',
                    activeStageIndex: activeStageIndex,
                    stageSubLabels: buildStageSubLabels(rawEvents, activeStageIndex, d.estimatedDelivery),
                    estimatedDeliveryLabel: deliveryDate ? formatShortDate(deliveryDate) : null,
                    events: events,
                    trackingUrl: trackingUrl(number)
                };
            }

            async function fetchFromMailAmericasDirect(codes) {
                var packages = [];
                var rejected = [];
                for (var i = 0; i < codes.length; i++) {
                    var code = codes[i];
                    try {
                        var res = await fetch('https://mailamericas.com/api/tracking', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                            body: JSON.stringify({ trackingNumber: code, language: 'es' })
                        });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        var json = await res.json();
                        var pkg = normalizeMailAmericas(json, code);
                        if (!pkg) throw new Error('Sin datos');
                        packages.push(pkg);
                    } catch (err) {
                        rejected.push({ number: code, message: err.message });
                    }
                }
                if (packages.length === 0 && rejected.length === codes.length) {
                    return null;
                }
                return { packages: packages, rejected: rejected, fromMailAmericas: true };
            }

            function setStatus(text, type) {
                statusMsg.textContent = text || '';
                statusMsg.className = type ? type : '';
            }

            function loadStoredCodes() {
                try {
                    var raw = localStorage.getItem(STORAGE_KEY);
                    if (raw === null) return null;
                    var parsed = JSON.parse(raw);
                    return Array.isArray(parsed) ? parsed : [];
                } catch (e) {
                    return null;
                }
            }

            function saveCodes(codes) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(codes));
                    return true;
                } catch (e) {
                    setStatus('No se pudieron guardar los códigos (¿modo privado?). La consulta sigue en esta sesión.', 'warn');
                    return false;
                }
            }

            function buildBarra(activeIndex, stageSubLabels) {
                var barra = document.createElement('div');
                barra.className = 'barra';
                var subs = stageSubLabels || [];
                ETAPAS.forEach(function (nombre, idx) {
                    var etapa = document.createElement('div');
                    etapa.className = 'etapa' + (idx <= activeIndex ? ' activa' : '');
                    var nombreEl = document.createElement('span');
                    nombreEl.className = 'etapa-nombre';
                    nombreEl.textContent = nombre;
                    etapa.appendChild(nombreEl);
                    if (subs[idx]) {
                        var sub = document.createElement('span');
                        sub.className = 'etapa-sub';
                        sub.textContent = subs[idx];
                        etapa.appendChild(sub);
                    }
                    barra.appendChild(etapa);
                });
                return barra;
            }

            function buildEventosList(events) {
                if (!events || events.length === 0) {
                    var vacio = document.createElement('p');
                    vacio.className = 'eventos-vacio';
                    vacio.textContent = 'Sin movimientos registrados todavía.';
                    return vacio;
                }

                var ul = document.createElement('ul');
                ul.className = 'eventos';
                events.forEach(function (evt) {
                    var li = document.createElement('li');
                    var linea = document.createElement('div');
                    linea.textContent = evt.description || 'Evento';
                    li.appendChild(linea);
                    if (evt.time) {
                        var fecha = document.createElement('div');
                        fecha.className = 'fecha';
                        fecha.textContent = evt.time + (evt.location ? ' → ' + evt.location : '');
                        li.appendChild(fecha);
                    } else if (evt.location) {
                        var lugar = document.createElement('div');
                        lugar.className = 'lugar';
                        lugar.textContent = evt.location;
                        li.appendChild(lugar);
                    }
                    ul.appendChild(li);
                });
                return ul;
            }

            function renderPackage(pkg) {
                var card = document.createElement('div');
                card.className = 'envio';

                var h3 = document.createElement('h3');
                h3.textContent = pkg.number;
                card.appendChild(h3);

                var estado = document.createElement('p');
                estado.innerHTML = '<strong>Estado actual:</strong> ' + (pkg.statusLabel || 'Consultando');
                card.appendChild(estado);

                if (pkg.estimatedDeliveryLabel) {
                    var entrega = document.createElement('p');
                    entrega.className = 'entrega-estimada';
                    entrega.innerHTML = '<strong>Entrega estimada:</strong> ' + pkg.estimatedDeliveryLabel;
                    card.appendChild(entrega);
                }

                card.appendChild(buildBarra(
                    pkg.activeStageIndex != null ? pkg.activeStageIndex : 0,
                    pkg.stageSubLabels
                ));
                card.appendChild(buildEventosList(pkg.events));

                var footer = document.createElement('div');
                footer.className = 'envio-footer';
                var link = document.createElement('a');
                link.href = pkg.trackingUrl || trackingUrl(pkg.number);
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = 'Ver en MailAmericas';
                footer.appendChild(link);
                card.appendChild(footer);

                return card;
            }

            function renderRejected(item) {
                var card = document.createElement('div');
                card.className = 'envio error-card';
                card.innerHTML = '<h3>' + item.number + '</h3>' +
                    '<p><strong>Error:</strong> ' + (item.message || 'No se pudo consultar') + '</p>' +
                    '<div class="envio-footer"><a href="' + trackingUrl(item.number) + '" target="_blank" rel="noopener noreferrer">Intentar en MailAmericas</a></div>';
                return card;
            }

            function renderResults(data, codes) {
                enviosList.innerHTML = '';
                if (codes.length === 0) {
                    enviosEmpty.hidden = false;
                    return;
                }
                enviosEmpty.hidden = true;

                var byNumber = {};
                (data.packages || []).forEach(function (p) { byNumber[p.number] = p; });

                codes.forEach(function (code) {
                    if (byNumber[code]) {
                        enviosList.appendChild(renderPackage(byNumber[code]));
                    }
                });

                (data.rejected || []).forEach(function (r) {
                    if (codes.indexOf(r.number) !== -1) {
                        enviosList.appendChild(renderRejected(r));
                    }
                });

                codes.forEach(function (code) {
                    if (!byNumber[code] && !(data.rejected || []).some(function (r) { return r.number === code; })) {
                        enviosList.appendChild(renderRejected({
                            number: code,
                            message: 'Sin datos. Si usás GitHub Pages, ejecutá npm run envios o actualizá tracking-cache.json.'
                        }));
                    }
                });
            }

            function renderLoading(codes) {
                enviosList.innerHTML = '';
                enviosEmpty.hidden = true;
                codes.forEach(function (code) {
                    var card = document.createElement('div');
                    card.className = 'envio';
                    card.innerHTML = '<h3>' + code + '</h3><p>Consultando movimientos…</p>';
                    enviosList.appendChild(card);
                });
            }

            async function fetchTrackingData(codes) {
                var direct = await fetchFromMailAmericasDirect(codes);
                if (direct && direct.packages.length > 0) {
                    return direct;
                }

                var base = resolveApiBase();
                var apiUrl = (base || '') + '/api/track';
                try {
                    var res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ codes: codes })
                    });
                    if (res.ok) {
                        return await res.json();
                    }
                } catch (e) {
                    /* proxy local no disponible */
                }

                if (direct) {
                    return direct;
                }

                try {
                    var cacheRes = await fetch('tracking-cache.json');
                    if (cacheRes.ok) {
                        var cache = await cacheRes.json();
                        var wanted = new Set(codes);
                        var filtered = {
                            packages: (cache.packages || []).filter(function (p) { return wanted.has(p.number); }),
                            rejected: (cache.rejected || []).filter(function (r) { return wanted.has(r.number); }),
                            fromCache: true
                        };
                        if (filtered.packages.length > 0 || filtered.rejected.length > 0) {
                            return filtered;
                        }
                    }
                } catch (e2) {
                    /* sin caché */
                }

                return null;
            }

            async function consultar() {
                var codes = parseTrackingCodes(textarea.value);
                saveCodes(codes);
                btnConsultar.disabled = true;

                if (codes.length === 0) {
                    enviosList.innerHTML = '';
                    enviosEmpty.hidden = false;
                    setStatus('No hay códigos. El listado quedó vacío.', '');
                    btnConsultar.disabled = false;
                    return;
                }

                enviosEmpty.hidden = true;
                setStatus('Consultando movimientos…', '');
                renderLoading(codes);

                var data = await fetchTrackingData(codes);

                if (!data) {
                    codes.forEach(function (code) {
                        enviosList.innerHTML = '';
                        enviosList.appendChild(renderRejected({
                            number: code,
                            message: 'No se pudo consultar. Probá npm run envios o actualizá tracking-cache.json en GitHub Actions.'
                        }));
                    });
                    setStatus('No se pudo conectar con la API de seguimiento.', 'error');
                    btnConsultar.disabled = false;
                    return;
                }

                renderResults(data, codes);

                var msg = codes.length === 1 ? '1 envío consultado.' : codes.length + ' envíos consultados.';
                if (data.fromCache) {
                    msg += ' (datos en caché)';
                }
                setStatus(msg, '');
                btnConsultar.disabled = false;
            }

            function init() {
                updateApiHint();
                var stored = loadStoredCodes();
                if (stored === null) {
                    textarea.value = DEFAULT_CODES.join('\n');
                } else {
                    textarea.value = stored.join('\n');
                }
                btnConsultar.addEventListener('click', consultar);
                consultar();
            }

            init();
        })();
    </script>
</body>

</html>
